name: Build Zero TV APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v5
        with: { distribution: 'temurin', java-version: '17' }
      - uses: android-actions/setup-android@v3

      - name: Build Website
        run: |
          npm install
          npm run build

      - name: Create Android Project Fixed
        run: |
          rm -rf android
          mkdir -p android/app/src/main/assets/public
          mkdir -p android/app/src/main/java/com/zerotv/app
          cp -r dist/* android/app/src/main/assets/public/
          
          cat > android/settings.gradle << 'SETTINGS'
          include ':app'
          SETTINGS
          
          cat > android/build.gradle << 'GRADLE'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          GRADLE
          
          cat > android/app/build.gradle << 'APP'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.zerotv.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.zerotv.app"
                  minSdk 22
                  targetSdk 34
                  versionCode 2
                  versionName "1.1"
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          APP
          
          cat > android/app/src/main/AndroidManifest.xml << 'MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application android:allowBackup="true" android:label="Zero TV" android:usesCleartextTraffic="true" android:theme="@android:style/Theme.NoTitleBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST
          
          cat > android/app/src/main/java/com/zerotv/app/MainActivity.kt << 'KOTLIN'
          package com.zerotv.app
          import android.os.Bundle
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.appcompat.app.AppCompatActivity
          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val webView = WebView(this)
                  webView.settings.javaScriptEnabled = true
                  webView.settings.domStorageEnabled = true
                  webView.settings.allowFileAccess = true
                  webView.settings.allowFileAccessFromFileURLs = true
                  webView.settings.allowUniversalAccessFromFileURLs = true
                  webView.webViewClient = WebViewClient()
                  webView.loadUrl("file:///android_asset/public/index.html")
                  setContentView(webView)
              }
          }
          KOTLIN

      - name: Build APK
        run: |
          cd android
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zero-tv-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
